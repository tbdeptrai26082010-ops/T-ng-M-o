<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Mèo - Chúc Mừng 20/10 🌸</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0614;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Fullscreen Canvases */
        #petalCanvas, #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #petalCanvas { z-index: 5; }
        #sparkleCanvas { z-index: 15; }

        /* Glowing Neon Heart Background Animation */
        .glowing-heart {
            position: relative;
            width: 120px;
            height: 120px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.8)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 30px rgba(255, 20, 147, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.8)); }
        }

        /* Glowing Text Styles */
        .glow-title {
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff007f;
        }

        .glow-text {
            text-shadow: 0 0 8px rgba(255, 192, 203, 0.8);
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #ff69b4;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Custom Floating Particles */
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative px-4 overflow-hidden">

    <!-- Canvases for Effects -->
    <canvas id="petalCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>

    <!-- Music Toggle Button -->
    <button id="musicToggleBtn" onclick="toggleAudio()" class="fixed top-5 right-5 z-50 bg-white/10 hover:bg-white/20 backdrop-blur-md text-pink-300 border border-pink-500/30 w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg">
        <i id="musicIcon" class="fas fa-music text-lg animate-pulse"></i>
    </button>

    <!-- INTRO OVERLAY SCREEN -->
    <div id="startScreen" class="fixed inset-0 z-40 bg-black/90 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center transition-opacity duration-1000">
        <div class="glowing-heart mb-8 flex items-center justify-center">
            <i class="fas fa-heart text-7xl text-pink-500"></i>
        </div>

        <h1 class="font-dancing text-4xl md:text-6xl text-pink-300 mb-4 glow-title">Gửi Mèo 🌸</h1>
        <p class="text-gray-300 text-sm md:text-base font-light mb-8 max-w-md leading-relaxed">
            Có một món quà nhỏ lãng mạn dành riêng cho Mèo nhân ngày 20/10. Chạm vào nút bên dưới nhé!
        </p>

        <button onclick="startExperience()" class="px-8 py-4 bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 text-white font-semibold rounded-full shadow-2xl hover:scale-105 active:scale-95 transition transform duration-300 flex items-center gap-3 border border-pink-300/40">
            <i class="fas fa-envelope-open-text text-xl"></i> Mở Quà Tặng Mèo
        </button>
    </div>

    <!-- MAIN GREETING DISPLAY (No final box overlay) -->
    <main id="mainContent" class="z-20 text-center max-w-2xl mx-auto opacity-0 transition-opacity duration-1000 my-auto py-12">
        <div class="mb-6 inline-block px-5 py-1.5 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-300 text-xs tracking-widest uppercase">
            20 / 10 / 2026 ❤️
        </div>

        <h1 class="font-playfair text-3xl md:text-5xl font-bold text-white mb-2 leading-tight">
            Chúc Mừng Ngày <br/>
            <span class="font-dancing text-5xl md:text-7xl text-pink-400 glow-title block mt-2">Phụ Nữ Việt Nam</span>
        </h1>

        <!-- Typewriter Message Container -->
        <div class="min-h-[160px] md:min-h-[180px] flex items-center justify-center my-8 px-4">
            <p id="typewriterText" class="font-dancing text-2xl md:text-3xl text-pink-100 leading-relaxed glow-text italic"></p>
            <span id="cursor" class="cursor h-8"></span>
        </div>

        <!-- Decor Floating Heart Icon -->
        <div class="mt-8">
            <i class="fas fa-heart text-pink-500 text-3xl animate-bounce"></i>
        </div>
    </main>

    <script>
        // TYPEWRITER TEXT FOR MÈO
        const message = "Gửi Mèo yêu dấu, mong mỗi ngày của Mèo đều tràn ngập hoa, rực rỡ sắc nắng, rộn ràng tiếng cười và luôn tràn ngập hạnh phúc. Chúc Mèo 20/10 thật tuyệt vời!";
        let charIndex = 0;
        let isTyping = false;

        function typeWriter() {
            if (charIndex < message.length) {
                document.getElementById("typewriterText").innerHTML += message.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 65);
            } else {
                document.getElementById("cursor").style.display = "none";
                // Trigger periodic fireworks for continuous romantic vibe
                setInterval(triggerFireworks, 3500);
            }
        }

        // START EXPERIENCE
        function startExperience() {
            const startScreen = document.getElementById('startScreen');
            const mainContent = document.getElementById('mainContent');
            
            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.style.display = 'none';
                mainContent.classList.remove('opacity-0');
                typeWriter();
            }, 1000);

            // Play Synth Audio
            playSynthBGM();
            triggerFireworks();
        }

        // WEB AUDIO SYNTHESIZER (Gentle Melodic Sound)
        let audioCtx = null;
        let isPlaying = false;
        let timerId = null;

        function playSynthBGM() {
            if (isPlaying) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            isPlaying = true;

            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 329.63]; 
            let noteIdx = 0;

            function playNextNote() {
                if (!isPlaying || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);

                noteIdx = (noteIdx + 1) % notes.length;
                timerId = setTimeout(playNextNote, 600);
            }

            playNextNote();
            document.getElementById('musicIcon').classList.add('animate-spin');
        }

        function toggleAudio() {
            if (isPlaying) {
                isPlaying = false;
                if (timerId) clearTimeout(timerId);
                if (audioCtx) audioCtx.close();
                document.getElementById('musicIcon').classList.remove('animate-spin');
            } else {
                playSynthBGM();
            }
        }

        // FIREWORKS EFFECT
        function triggerFireworks() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff69b4', '#ff1493', '#ffd700', '#ffffff']
                });
            }
        }

        // FALLING PETALS CANVAS ENGINE
        const pCanvas = document.getElementById('petalCanvas');
        const pCtx = pCanvas.getContext('2d');
        let pWidth = pCanvas.width = window.innerWidth;
        let pHeight = pCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            pWidth = pCanvas.width = window.innerWidth;
            pHeight = pCanvas.height = window.innerHeight;
        });

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * pWidth;
                this.y = -20;
                this.size = Math.random() * 12 + 8;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 2 - 1;
                this.color = ['#ffb6c1', '#ff69b4', '#ff1493', '#f8bbd0'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 30) + this.speedX;
                this.angle += this.spin;
                if (this.y > pHeight + 20) this.reset();
            }
            draw() {
                pCtx.save();
                pCtx.translate(this.x, this.y);
                pCtx.rotate((this.angle * Math.PI) / 180);
                pCtx.fillStyle = this.color;
                pCtx.beginPath();
                pCtx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                pCtx.fill();
                pCtx.restore();
            }
        }

        const petals = Array.from({ length: 45 }, () => new Petal());
        function animatePetals() {
            pCtx.clearRect(0, 0, pWidth, pHeight);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // MOUSE / TOUCH SPARKLE TRAIL ENGINE
        const sCanvas = document.getElementById('sparkleCanvas');
        const sCtx = sCanvas.getContext('2d');
        sCanvas.width = window.innerWidth;
        sCanvas.height = window.innerHeight;

        let sparkles = [];
        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1;
                this.color = '#ffb6c1';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.02;
            }
            draw() {
                sCtx.save();
                sCtx.globalAlpha = Math.max(0, this.life);
                sCtx.fillStyle = this.color;
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();
            }
        }

        function addSparkles(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x && y) {
                for (let i = 0; i < 3; i++) {
                    sparkles.push(new Sparkle(x, y));
                }
            }
        }

        window.addEventListener('mousemove', addSparkles);
        window.addEventListener('touchmove', addSparkles);

        function animateSparkles() {
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            sparkles.forEach((s, idx) => {
                s.update();
                s.draw();
                if (s.life <= 0) sparkles.splice(idx, 1);
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();
    </script>
</body>
</html>
